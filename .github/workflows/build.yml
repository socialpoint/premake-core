name: Build premake-core
run-name: Build premake-core for ${{ inputs.platform }} platfom

on:
  workflow_dispatch:
    inputs:
        platform:
            required: true
            default: all
            type: choice
            options:
                - all
                - macos
                - windows
                - linux

jobs:
    macos:
        if: ${{ inputs.platform }} == 'macos' || ${{ inputs.platform }} == 'all'
        runs-on: macos-latest
        timeout-minutes: 30
        steps:
            - run: echo "Building for macos..."